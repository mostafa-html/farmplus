# nginx/nginx.conf
# Reverse proxy for FarmPulse production stack.
#
# HTTP (port 80)  — handles both REST API and WebSocket upgrades.
# Daphne runs on farmpulse_django:8000 inside the Docker network.
# HTTPS/TLS: obtain a cert (e.g. Certbot) and uncomment the ssl block below.

upstream daphne {
    server farmpulse_django:8000;
}

server {
    listen 80;
    server_name _; # accepts any hostname — replace with your domain when ready

    # ── Static & media files (served directly, bypass Django) ──────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # ── WebSocket connections ───────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://daphne;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── HTTP API & Django admin ─────────────────────────────────────────────
    location / {
        proxy_pass http://daphne;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ── HTTPS (uncomment after obtaining a TLS certificate) ────────────────
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    # # Redirect HTTP → HTTPS
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }
}
